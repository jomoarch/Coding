# 所有键都是可选的，这里把能写的都写出来，按需改值即可；用不到的键删掉也一样
# 相对路径都以 `base` 为起点。
# 想把这份配置放在别处复用，就在 .exe 旁边放一个 config.link（内容是一行路径）
# `base`、`config.link` 和每个键的细节见 README 的「配置」

base = "."

[compiler]
source = "test/src/solution.cpp"
output = "test/bin/solution.exe"
output_probe = "test/bin/solution.probe.exe"
args = ["g++", "-std=c++17", "-O2", "-Wall", "-Wextra"] # 源码与 -o <output> 会自动追加

[inject]
enabled = true                    # 关掉就不需要下面的头文件
header = "include/inject/probe.h" # 删掉这行就自动去 base、配置目录、exe 目录找

[runner]
work_dir = "test/work" # 每个测试点还会在它下面各占一个子目录
time_limit_ms = 1000   # CPU_time 上限；删掉这行或设置为 0 就永远不杀超时程序
memory_limit_mb = 256  # 0 = 不限

[io]
input_dir = "test/in"                   # 存放 *.in 的目录
output_dir = "test/out"                 # 存放 *.out 的目录；cg_b 开跑前会清空它
single_input = "test/input"             # cg_s 的输入
single_output = "test/output"           # cg_s / cg_i 落盘的位置，也是 cmp_s 比的一侧
single_answer = "test/exc/solution.out" # cmp_s 的期望答案
answer_dir = "test/exc"                 # cmp_b 的期望答案目录，<name>.ans 优先于 <name>.out
result_root = "test/results"            # 比较结果仓库：<root>/single 与 <root>/batch
single_name = ""                        # 存档用的名字；留空 = 取 single_input 的文件名
single_max_count = 0                    # 单次比较库最多留几条；0 = 不限，保护的不计入
batch_max_count = 0                     # 批量库最多留多少个 run；0 = 不限
trash_max_bytes = 0                     # 回收站最多占多少字节；0 = 不限，超了删最早进的
colorize_output = true                  # cg_s / cg_i 里 stdout 绿、stderr 红

[thread]
thread_max = 4 # cg_b 的并发测试点数；同时受 CPU 核心数限制
